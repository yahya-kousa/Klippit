name: Windows installer
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      local_update_test:
        description: Read updates from a local folder for a two-version smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    env:
      QT_VERSION: 6.8.3
      VELO_VERSION: 1.2.0
      FFMPEG_VERSION: 8.1.1
      LOCAL_UPDATE_TEST: ${{ inputs.local_update_test && 'ON' || 'OFF' }}
    steps:
      - name: Set package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Use a stable version tag in vMAJOR.MINOR.PATCH format.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "PACK_VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
      - uses: actions/checkout@v4
        with:
          repository: qt/qtbase
          ref: v6.8.3
          sparse-checkout: LICENSES
          path: build-deps/qtbase
          persist-credentials: false

      - name: Get packaging tools and FFmpeg
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          function Expand-Verified($url, $hash, $name) {
            $zip = "build-deps/$name.zip"
            Invoke-WebRequest $url -OutFile $zip
            if ((Get-FileHash $zip).Hash -ne $hash) { throw "Checksum mismatch for $name" }
            Expand-Archive $zip "build-deps/$name"
          }
          Expand-Verified "https://github.com/velopack/velopack/releases/download/$env:VELO_VERSION/velopack_libc_$env:VELO_VERSION.zip" '547262ed7a1ab1ff62f580aa53851ede2f1a451ac61b8974eb7bc01117488835' 'velo'
          Expand-Verified "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip" '6f58ce889f59c311410f7d2b18895b33c03456463486f3b1ebc93d97a0f54541' 'ffmpeg'
          $ff = Resolve-Path "build-deps/ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          "$ff/bin" >> $env:GITHUB_PATH
          "FFMPEG_ROOT=$ff" >> $env:GITHUB_ENV
          dotnet tool install vpk --tool-path build-deps/tools --version $env:VELO_VERSION

      - name: Build, test and deploy
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = Resolve-Path build-deps/velo
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DKLIPPIT_VELOPACK_SDK=$sdk" "-DKLIPPIT_LOCAL_UPDATE_TEST=$env:LOCAL_UPDATE_TEST" -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix out/app
          windeployqt --release --no-compiler-runtime out/app/klippit.exe
          Copy-Item "$env:FFMPEG_ROOT/bin/ffmpeg.exe","$env:FFMPEG_ROOT/bin/ffprobe.exe" out/app
          New-Item -ItemType Directory out/app/notices | Out-Null
          Copy-Item build-deps/qtbase/LICENSES out/app/notices/Qt -Recurse
          Copy-Item "$env:FFMPEG_ROOT/LICENSE" out/app/notices/FFmpeg-LICENSE.txt
          Copy-Item "$env:FFMPEG_ROOT/README.txt" out/app/notices/FFmpeg-build.txt
          Invoke-WebRequest "https://raw.githubusercontent.com/velopack/velopack/$env:VELO_VERSION/LICENSE" -OutFile out/app/notices/Velopack-LICENSE.txt
          Copy-Item README.md out/app
          foreach ($file in 'velopack_libc.dll','Qt6Core.dll','platforms/qwindows.dll','multimedia/ffmpegmediaplugin.dll','vcruntime140.dll') {
            if (!(Test-Path "out/app/$file")) { throw "Deployment is missing $file" }
          }

      - name: Smoke-test staged app without developer PATH
        timeout-minutes: 2
        env:
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: "1"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location out/app
          $env:PATH = "$pwd;$env:SystemRoot/system32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Write-Host "Starting staged recorder help check"
          ./klippit-record.exe --help
          Write-Host "Checking staged ffprobe"
          ./ffprobe.exe -version
          Write-Host "Checking staged FFmpeg capture filters"
          $filters = ./ffmpeg.exe -hide_banner -filters
          if (!($filters -match '\bddagrab\b')) { throw 'Packaged FFmpeg has no desktop capture filter' }

          Write-Host "Opening staged editor window"
          $log = Join-Path $env:RUNNER_TEMP 'klippit-editor-stderr.txt'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $editor = Start-Process ./klippit.exe -ArgumentList '--smoke-test-editor' -PassThru -RedirectStandardError $log
          try {
            if (!$editor.WaitForExit(20000)) { throw 'Editor startup timed out' }
            if ($editor.ExitCode -ne 0) { throw "Editor exited with code $($editor.ExitCode)" }
            if (!(Select-String -LiteralPath $log -Pattern '^Editor window ready$' -Quiet)) {
              throw 'Editor exited before confirming its window was ready'
            }
          } finally {
            if (!$editor.HasExited) { $editor.Kill(); $editor.WaitForExit() }
            Get-Content -LiteralPath $log
          }

      - name: Package installer and update
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./build-deps/tools/vpk.exe pack --packId Klippit --packVersion $env:PACK_VERSION --mainExe klippit.exe --runtime win-x64 --packDir out/app --outputDir out/installer
          $feed = Get-Content out/installer/releases.win.json -Raw | ConvertFrom-Json
          $full = @($feed.Assets | Where-Object Type -eq Full)
          if ($full.Count -ne 1 -or $full[0].Version -ne $env:PACK_VERSION -or !(Test-Path -LiteralPath (Join-Path out/installer $full[0].FileName))) {
            throw 'Full update package missing from the generated release feed'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Klippit-Windows-x64
          path: out/installer/*Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Klippit-Windows-x64-update
          path: |
            out/installer/releases.win.json
            out/installer/*-full.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: klippit-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Klippit-Windows-x64*
          merge-multiple: true
          path: release

      - name: Publish Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release list --limit 100 --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "$latest" ]]; then
            if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Latest release has an unexpected tag: $latest" >&2
              exit 1
            fi
            highest="$(printf '%s\n' "$latest" "$GITHUB_REF_NAME" | sort -V | tail -n 1)"
            if [[ "$latest" == "$GITHUB_REF_NAME" || "$highest" != "$GITHUB_REF_NAME" ]]; then
              echo "Release $GITHUB_REF_NAME must be newer than $latest." >&2
              exit 1
            fi
          fi
          gh release create "$GITHUB_REF_NAME" release/*Setup.exe release/releases.win.json release/*-full.nupkg \
            --verify-tag --generate-notes --latest --title "Klippit $GITHUB_REF_NAME"
